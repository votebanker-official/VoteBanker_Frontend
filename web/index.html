<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VOTE BANKER politician accelerator platform.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F4F8FC">
  <meta name="apple-mobile-web-app-title" content="VOTE BANKER">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>VOTE BANKER</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background-color: #F4F8FC;
    }
  </style>
  <script>
    // Facebook returns with ?auth_ticket= before Flutter starts. Keep the ticket
    // and move the address bar to /profile immediately, so the app cannot boot
    // on the login URL and drop the sign-in.
    try {
      var params = new URLSearchParams(window.location.search);
      var ticket = params.get('auth_ticket');
      var authError = params.get('auth_error');
      if (ticket) {
        sessionStorage.setItem('vb_auth_ticket', ticket);
        history.replaceState(null, '', '/profile');
      } else if (authError) {
        sessionStorage.setItem('vb_auth_error', authError);
        history.replaceState(null, '', '/');
      }
    } catch (e) {}
  </script>
  <script>
    // Avoid a light flash for visitors who chose dark mode (saved by the app).
    try {
      if (String(localStorage.getItem('flutter.theme_mode')).indexOf('dark') !== -1) {
        document.documentElement.style.backgroundColor = '#050B14';
        document.addEventListener('DOMContentLoaded', function () {
          document.body.style.backgroundColor = '#050B14';
        });
      }
    } catch (e) {}
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
